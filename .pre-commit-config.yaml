# Install once:  pip install pre-commit
#                pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# Bump pinned revs with:  pre-commit autoupdate
# (Dependabot does not cover the pre-commit ecosystem.)

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ── Secret scanning ────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── Commit message convention (see .gitmessage) ────────────────────────────
  - repo: local
    hooks:
      - id: check-commit-subject
        name: commit subject follows Conventional Commits, <= 72 chars
        entry: python scripts/check-commit-subject.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  # ── Lint / format: pinned to the same ruff version CI runs ─────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|tests)/
      - id: ruff-format
        files: ^(app|tests)/

  # ── General hygiene ───────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
