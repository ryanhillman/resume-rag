name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy runs on the VM itself, so no scope beyond reading the code.
permissions:
  contents: read

# A single-vCPU VM cannot build twice at once, and a half-finished deploy must
# not be cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.2
      - run: ruff check app/ tests/

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest httpx fpdf2
      - run: pytest tests/

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra fmt -check

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [lint, audit, test, validate-terraform]
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      # azure/login trades this short-lived token for Azure credentials, so
      # this workflow references no secrets at all.
      id-token: write
    env:
      RESOURCE_GROUP: resume-rag-rg
      VM_NAME: resume-rag-vm
      DOMAIN: resume-rag.eastus.cloudapp.azure.com
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit on the VM
        env:
          COMMIT: ${{ github.sha }}
        run: |
          # Run Command executes the script with bash whatever its first
          # line is, so COMMIT goes in front. Asserted, because a failed
          # prepend would silently deploy the tip of main instead.
          { echo "COMMIT=$COMMIT"; cat scripts/deploy-on-vm.sh; } > deploy.sh
          head -n 1 deploy.sh | grep -qxF "COMMIT=$COMMIT"

          # One run command name, so each deploy overwrites the last.
          az vm run-command create \
            --resource-group "$RESOURCE_GROUP" \
            --vm-name "$VM_NAME" \
            --name deploy \
            --script "$(cat deploy.sh)" \
            --output none

      - name: Report the deploy result
        run: |
          az vm run-command show             --resource-group "$RESOURCE_GROUP" --vm-name "$VM_NAME"             --name deploy --instance-view -o json > view.json
          jq -r '.instanceView.output // ""' view.json
          jq -r '.instanceView.error // ""' view.json >&2
          code=$(jq -r '.instanceView.exitCode' view.json)
          echo "script exit code: $code"
          # run-command succeeds if the agent ran the script at all, so the
          # script's own status has to be asserted here.
          test "$code" = "0"

      - name: Verify the app answers
        run: |
          # As a visitor would, so this also validates the public certificate.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://${DOMAIN}/"; then
              echo "app is responding"
              exit 0
            fi
            sleep 4
          done
          echo "app did not respond within 120s"
          exit 1
