version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Exact pins make Dependabot offer pre-releases, so a new Python minor is a manual change.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
