<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume RAG — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa; color: #212529;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
      padding: 32px 28px; width: 100%; max-width: 340px;
    }
    h1 { font-size: 1.3rem; font-weight: 600; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 0.88rem; font-weight: 500; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; padding: 9px 12px;
      border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem;
      margin-bottom: 14px;
    }
    input[type="password"]:focus { outline: 2px solid #0d6efd; border-color: transparent; }
    button {
      width: 100%; padding: 9px; background: #0d6efd; color: #fff;
      border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { background: #0b5ed7; }
    .error { color: #dc3545; font-size: 0.85rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resume RAG</h1>
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
    <!--ERROR-->
  </div>
</body>
</html>
